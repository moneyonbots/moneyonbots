{% extends "dashboard/base.html" %}
{% load static %}
{% block title %}Moneybots — Live Analysis{% endblock %}

{% block content %}
<div class="layout layout-full">
    <section class="chart-col">
        <div id="chart-container">
            <div id="scanner-beam" class="scanner-beam"></div>
            <div class="brain-icon-overlay" id="brain-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"/>
                    <path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"/>
                </svg>
            </div>
            <div class="tradingview-logo">
                <span class="tv-logo">TV</span>
            </div>
            <div id="chart-loader" class="chart-loader">
                <div class="loader-spinner"></div>
                <div class="loader-text">Loading chart...</div>
            </div>
        </div>
    </section>
</div>

<!-- Centralized Market Data Service -->
<script src="{% static 'js/market_data_service.js' %}?v=6"></script>
<!-- Free, open-source Lightweight Charts (renders Deriv data via public WebSocket, no licensed library required) -->
<script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
<script src="{% static 'js/chart.js' %}?v=1"></script>
<script>
    // Show loader initially
    document.addEventListener('DOMContentLoaded', function() {
        const loader = document.getElementById('chart-loader');
        if (loader) {
            loader.classList.add('active');
        }
    });

    // Initialize the Deriv candlestick chart. Hide the loader once it mounts
    // (or if the charting library failed to load) so the page never spins forever.
    (function mountChart() {
        function start() {
            var handle = null;
            if (window.LightweightCharts && typeof window.initDerivChart === 'function') {
                handle = window.initDerivChart({
                    containerId: "chart-container",
                    defaultSymbol: "{{ default_symbol }}",
                });
            }
            var loader = document.getElementById('chart-loader');
            if (loader) {
                loader.classList.remove('active');
            }
            return handle;
        }
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', start);
        } else {
            start();
        }
    })();

    // WebSocket connection to send chart data to backend
    let analysisWs = null;
    let webSocketAvailable = false;
    
    function connectAnalysisWebSocket() {
        // Check if we're on Vercel (WebSockets not supported)
        if (window.location.hostname.includes('vercel.app')) {
            console.log('WebSockets not supported on Vercel, using HTTP-only mode');
            webSocketAvailable = false;
            return;
        }
        
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}/ws/analysis/`;
        
        try {
            analysisWs = new WebSocket(wsUrl);
            
            analysisWs.onopen = function() {
                console.log('Analysis WebSocket connected');
                webSocketAvailable = true;
                
                // Send initial chart data
                sendChartDataToBackend();
            };
            
            analysisWs.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    console.log('Received from analysis backend:', data);
                } catch (e) {
                    console.error('Error parsing analysis message:', e);
                }
            };
            
            analysisWs.onerror = function(error) {
                console.error('Analysis WebSocket error:', error);
                webSocketAvailable = false;
            };
            
            analysisWs.onclose = function() {
                console.log('Analysis WebSocket closed, reconnecting...');
                webSocketAvailable = false;
                setTimeout(connectAnalysisWebSocket, 5000);
            };
        } catch (e) {
            console.error('Failed to create WebSocket connection:', e);
            webSocketAvailable = false;
        }
    }

    let lastAllMarketsSent = 0;

    function sendChartDataToBackend() {
        if (!webSocketAvailable || !analysisWs || analysisWs.readyState !== WebSocket.OPEN) {
            return;
        }
        
        let symbol = window.currentChartSymbol;
        
        if (!symbol && window.marketDataService) {
            const currentData = window.marketDataService.getCurrentData();
            symbol = currentData.symbol;
        }
        
        let price = window.currentChartPrice;
        let candle = null;
        let historical = [];
        
        if (window.marketDataService) {
            const currentData = window.marketDataService.getCurrentData();
            if (!price) price = currentData.price;
            candle = currentData.candle;
            historical = currentData.historical;

            const now = Date.now();
            if (now - lastAllMarketsSent > 15000) {
                lastAllMarketsSent = now;
                const allMarkets = window.marketDataService.getAllMarketData();
                Object.keys(allMarkets).forEach(function(marketSymbol) {
                    if (marketSymbol === symbol) return;
                    const market = allMarkets[marketSymbol];
                    analysisWs.send(JSON.stringify({
                        type: 'chart_data',
                        symbol: marketSymbol,
                        data: {
                            price: market.price,
                            candle: market.candle,
                            historical: market.historical,
                        }
                    }));
                });
            }
        }
        
        // Only send if we have a symbol
        if (symbol) {
            analysisWs.send(JSON.stringify({
                type: 'chart_data',
                symbol: symbol,
                data: {
                    price: price,
                    candle: candle,
                    historical: historical
                }
            }));
            
            console.log('Sent chart data to backend:', symbol, 'price:', price);
        } else {
            console.log('Skipping chart data send - no symbol available');
        }
    }

    // Send symbol changes to backend
    function sendSymbolChangeToBackend(symbol) {
        if (!webSocketAvailable || !analysisWs || analysisWs.readyState !== WebSocket.OPEN) {
            return;
        }
        
        analysisWs.send(JSON.stringify({
            type: 'symbol_change',
            symbol: symbol
        }));
        
        console.log('Sent symbol change to backend:', symbol);
    }

    // Helper function to get CSRF token for HTTP requests
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    // Send current symbol to backend via HTTP (fallback)
    function sendCurrentSymbolToBackend(symbol) {
        fetch('/api/current-symbol/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify({ symbol: symbol })
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'success') {
                console.log('Current symbol sent to backend via HTTP:', symbol);
            } else {
                console.error('Error sending symbol to backend:', data.message);
            }
        })
        .catch(error => {
            console.error('Failed to send symbol to backend:', error);
        });
    }

    // Initialize chart data integration
    document.addEventListener('DOMContentLoaded', function() {
        // Connect to analysis WebSocket (will skip on Vercel)
        connectAnalysisWebSocket();
        
        // Wait for market data service to be ready
        setTimeout(function() {
            if (window.marketDataService) {
                // Initialize with current chart symbol if available
                if (window.currentChartSymbol) {
                    window.marketDataService.setCurrentSymbol(window.currentChartSymbol);
                }
                
                // Only set up WebSocket integration if available
                if (webSocketAvailable) {
                    // Throttled sending of real-time chart data to backend
                    let lastChartDataSentTime = 0;
                    function sendChartDataThrottled() {
                        const now = Date.now();
                        if (now - lastChartDataSentTime >= 350) {
                            lastChartDataSentTime = now;
                            sendChartDataToBackend();
                        }
                    }

                    // Subscribe to price updates to send real-time data
                    window.marketDataService.subscribe('price', function(price) {
                        sendChartDataThrottled();
                    });
                    
                    // Subscribe to candle updates
                    window.marketDataService.subscribe('candle', function(candle) {
                        sendChartDataThrottled();
                    });

                    // Listen to per-tick update events
                    window.addEventListener('tick-update', function() {
                        sendChartDataThrottled();
                    });
                    
                    // Send periodic chart data updates (every 5 seconds)
                    setInterval(sendChartDataToBackend, 5000);
                }
                
                // Watch for symbol changes (works with or without WebSockets)
                let lastSymbol = window.currentChartSymbol;
                setInterval(function() {
                    if (window.currentChartSymbol && window.currentChartSymbol !== lastSymbol) {
                        lastSymbol = window.currentChartSymbol;
                        
                        // Update market data service
                        window.marketDataService.setCurrentSymbol(window.currentChartSymbol);
                        
                        // Send to backend via HTTP (works on Vercel)
                        sendCurrentSymbolToBackend(window.currentChartSymbol);
                        
                        // Also send via WebSocket if available
                        if (webSocketAvailable) {
                            sendSymbolChangeToBackend(window.currentChartSymbol);
                        }
                    }
                }, 1000);
                
                console.log('Chart data integration ready (WebSocket: ' + webSocketAvailable + ')');
            }
        }, 2000);
    });
</script>
{% endblock %}
