{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Password Changed" %} - Moneybots{% endblock %}

{% block content %}
<style>
.auth-page-wrapper {
    min-height: calc(100vh - 40px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    background: radial-gradient(circle at 50% 10%, rgba(255, 106, 0, 0.05) 0%, transparent 60%), #f1f4f8;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}

.auth-card {
    background: #ffffff;
    border: 1px solid #dfe3e8;
    border-radius: 20px;
    padding: 44px 38px;
    width: 100%;
    max-width: 440px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06), 0 1px 3px rgba(0, 0, 0, 0.04);
}

.auth-icon-circle {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: rgba(16, 185, 129, 0.1);
    color: #10b981;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
}

.auth-header h1 {
    font-size: 24px;
    font-weight: 700;
    color: #0f172a;
    margin: 0 0 10px;
}

.auth-header p {
    font-size: 14px;
    color: #64748b;
    margin: 0 0 28px;
    line-height: 1.6;
}

.btn-primary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 13px 20px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    border: none;
    text-decoration: none;
    box-sizing: border-box;
    background: linear-gradient(135deg, #ff6a00 0%, #ff8c00 100%);
    color: #ffffff;
    box-shadow: 0 4px 12px rgba(255, 106, 0, 0.25);
}

.btn-primary:hover {
    background: linear-gradient(135deg, #f06400 0%, #ff8300 100%);
    box-shadow: 0 6px 16px rgba(255, 106, 0, 0.35);
    transform: translateY(-1px);
}
</style>

<div class="auth-page-wrapper">
    <div class="auth-card">
        <div class="auth-icon-circle">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </div>

        <div class="auth-header">
            <h1>Password Successfully Changed</h1>
            <p>Your password has been updated. You can now log into your Moneybots account.</p>
        </div>

        <a href="{% url 'account_login' %}" class="btn-primary">Sign In Now</a>
    </div>
</div>
{% endblock %}
