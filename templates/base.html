{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Moneybots{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23ff6a00'/%3E%3Cpath d='M8 10L8 22L12 22L12 14L16 18L20 14L20 22L24 22L24 10L20 10L16 14L12 10L8 10Z' fill='white'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=9">
</head>
<body>
    <header class="topbar" style="display: flex; align-items: center; justify-content: space-between; padding: 0 16px; height: 44px; border-bottom: 1px solid var(--border, #dfe3e8); background: #ffffff;">
        <a href="/" class="brand" style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 8px;">
            <svg class="brand-logo" width="28" height="28" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="32" height="32" rx="6" fill="url(#logo-gradient)"/>
                <path d="M8 10L8 22L12 22L12 14L16 18L20 14L20 22L24 22L24 10L20 10L16 14L12 10L8 10Z" fill="white" fill-opacity="0.95"/>
                <defs>
                    <linearGradient id="logo-gradient" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#ff6a00"/>
                        <stop offset="1" stop-color="#ff8c00"/>
                    </linearGradient>
                </defs>
            </svg>
            <span class="brand-text" style="font-weight: 800; letter-spacing: 0.5px; color: #0f172a;">MONEYBOTS</span>
        </a>
        <div style="display: flex; align-items: center; gap: 12px; margin-left: auto;">
            <a href="/" style="font-size: 13px; font-weight: 600; color: #64748b; text-decoration: none; display: flex; align-items: center; gap: 4px;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
                Terminal
            </a>
            {% if user.is_authenticated %}
            <a href="{% url 'user_profile' %}" style="font-size: 13px; font-weight: 600; color: #ff6a00; text-decoration: none; display: flex; align-items: center; gap: 4px;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                Dashboard
            </a>
            <a href="{% url 'account_logout' %}" style="font-size: 13px; font-weight: 500; color: #64748b; text-decoration: none;">Sign Out</a>
            {% else %}
            <a href="{% url 'account_login' %}" style="font-size: 13px; font-weight: 600; color: #334155; text-decoration: none;">Sign In</a>
            <a href="{% url 'account_signup' %}" style="font-size: 13px; font-weight: 600; color: #ffffff; background: #ff6a00; padding: 4px 12px; border-radius: 6px; text-decoration: none;">Sign Up</a>
            {% endif %}
        </div>
    </header>
    {% block content %}{% endblock %}
</body>
</html>
